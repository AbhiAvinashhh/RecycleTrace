{% extends "base.html" %}
{% block title %}Register Waste Request{% endblock %}
{% block nav_new %}active{% endblock %}
{% block page_title %}New Waste Collection Request{% endblock %}

{% block content %}
<div style="max-width: 650px; margin: 0 auto;">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">Register Segregated Waste</h3>
    </div>
    <form id="newBatchForm" novalidate>
      <div class="form-group">
        <label for="waste_category">Waste Category *</label>
        <select id="waste_category" name="waste_category" class="form-select" required>
          <option value="">Select Category...</option>
          <option value="plastic">Plastic (Bottles, containers, packaging)</option>
          <option value="paper">Paper & Cardboard (Clean, dry)</option>
          <option value="glass">Glass (Bottles, jars)</option>
          <option value="metal">Metal & Aluminium (Cans, foils, scrap)</option>
          <option value="e-waste">E-Waste (Electronics, batteries, cables)</option>
          <option value="organic">Organic / Compostable</option>
          <option value="hazardous">Hazardous (Paints, chemicals, CFLs)</option>
          <option value="mixed">Mixed Recyclables</option>
        </select>
      </div>

      <div class="form-group">
        <label for="declared_weight_kg">Estimated Weight (kg) *</label>
        <input type="number" step="0.1" min="0.1" id="declared_weight_kg" name="declared_weight_kg" class="form-input" placeholder="e.g. 5.5" required />
      </div>

      <div class="form-group">
        <label for="pickup_address">Pickup Address / Location *</label>
        <input type="text" id="pickup_address" name="pickup_address" class="form-input" placeholder="e.g. 104 Greenfield Avenue, Apt 4B" required />
      </div>

      <div class="form-group">
        <label for="notes">Notes / Handling Instructions (Optional)</label>
        <textarea id="notes" name="notes" class="form-textarea" placeholder="e.g. Rinsed and dried plastic containers in a clear blue bag."></textarea>
      </div>

      <div id="formError" class="form-error-msg hidden"></div>

      <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
        Generate Batch & QR Code
      </button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('newBatchForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errBox = document.getElementById('formError');
  errBox.classList.add('hidden');
  btn.disabled = true;

  const payload = {
    waste_category: document.getElementById('waste_category').value,
    declared_weight_kg: parseFloat(document.getElementById('declared_weight_kg').value),
    pickup_address: document.getElementById('pickup_address').value.trim(),
    notes: document.getElementById('notes').value.trim()
  };

  try {
    const res = await fetch('/api/batches', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (res.ok) {
      showToast('Batch registered! Redirecting to batch detail...', 'success');
      setTimeout(() => {
        window.location.href = `/batch/${data.batch.batch_id}`;
      }, 700);
    } else {
      let msg = data.error || 'Failed to create batch.';
      if (data.details) msg += ' ' + Object.values(data.details).join(', ');
      errBox.textContent = msg;
      errBox.classList.remove('hidden');
    }
  } catch (err) {
    errBox.textContent = 'Network error. Please try again.';
    errBox.classList.remove('hidden');
  } finally {
    btn.disabled = false;
  }
});
</script>
{% endblock %}
