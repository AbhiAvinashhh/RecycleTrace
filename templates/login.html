{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">♻</span>
      <span class="logo-text">RecycleTrace</span>
    </div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to continue tracking your waste</p>

    <form id="loginForm" class="auth-form" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
        <span class="field-error" id="emailError"></span>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
          <button type="button" class="input-toggle-btn" id="togglePassword" aria-label="Toggle password visibility">👁</button>
        </div>
        <span class="field-error" id="passwordError"></span>
      </div>

      <div id="loginError" class="form-error-msg hidden"></div>

      <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
        <span class="btn-text">Sign In</span>
        <span class="btn-spinner hidden">⟳</span>
      </button>
    </form>

    <div class="auth-divider">
      <span>Don't have an account?</span>
    </div>
    <a href="/register" class="btn btn-outline btn-full">Create Account</a>

    <div class="demo-accounts">
      <p class="demo-label">Demo accounts (development only):</p>
      <div class="demo-grid">
        <button class="demo-btn" data-email="citizen@demo.com" data-password="Demo1234!">🏠 Citizen</button>
        <button class="demo-btn" data-email="collector@demo.com" data-password="Demo1234!">🚛 Collector</button>
        <button class="demo-btn" data-email="operator@demo.com" data-password="Demo1234!">🏭 Operator</button>
        <button class="demo-btn" data-email="admin@demo.com" data-password="Demo1234!">🔍 Admin</button>
      </div>
    </div>

    <p class="auth-back"><a href="/">← Back to home</a></p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const form = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');

// Demo buttons
document.querySelectorAll('.demo-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('email').value = btn.dataset.email;
    document.getElementById('password').value = btn.dataset.password;
  });
});

// Toggle password
document.getElementById('togglePassword')?.addEventListener('click', () => {
  const p = document.getElementById('password');
  p.type = p.type === 'password' ? 'text' : 'password';
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.querySelector('.btn-text').classList.add('hidden');
  btn.querySelector('.btn-spinner').classList.remove('hidden');
  btn.disabled = true;
  loginError.classList.add('hidden');

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (res.ok) {
      showToast('Login successful!', 'success');
      setTimeout(() => { window.location.href = '/dashboard'; }, 600);
    } else {
      loginError.textContent = data.error || 'Login failed.';
      loginError.classList.remove('hidden');
    }
  } catch (err) {
    loginError.textContent = 'Network error. Please try again.';
    loginError.classList.remove('hidden');
  } finally {
    btn.querySelector('.btn-text').classList.remove('hidden');
    btn.querySelector('.btn-spinner').classList.add('hidden');
    btn.disabled = false;
  }
});
</script>
{% endblock %}
